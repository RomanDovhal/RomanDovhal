<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161c38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aa2ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26305a"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="320" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .hl { animation: pulse 3.2s ease-in-out infinite; }
      .cur { animation: move 6s ease-in-out infinite; }
      .l2 { animation: reveal 6s ease-in-out infinite; }
      .l3 { animation: reveal3 6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: .75 } }
      @keyframes move { 0%,100% { transform: translate(0,0) } 35% { transform: translate(-200px,-80px) } 70% { transform: translate(-120px,0px) } }
      @keyframes reveal { 0%,30% { opacity: 0 } 40%,100% { opacity: 1 } }
      @keyframes reveal3 { 0%,60% { opacity: 0 } 70%,100% { opacity: 1 } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)" opacity=".7"/>
    <circle cx="1180" cy="-40" r="260" fill="#5eead4" opacity=".05"/>
    <circle cx="60" cy="380" r="220" fill="#8aa2ff" opacity=".06"/>
  </g>

  <!-- text -->
  <text x="72" y="122" class="sans" font-size="58" font-weight="700" fill="#f4f6ff">Roman Dovhal</text>
  <text x="74" y="170" class="sans" font-size="26" font-weight="600" fill="url(#accent)">Fullstack Developer · LLM-powered products</text>
  <text x="74" y="216" class="sans" font-size="20" fill="#a3acd0">The model writes. Code verifies, runs and draws.</text>

  <g class="sans" font-size="14" font-weight="600">
    <rect x="74" y="244" width="150" height="32" rx="16" fill="#1c2446" stroke="#2f3a6b"/>
    <text x="149" y="265" text-anchor="middle" fill="#cdd5ff">📍 Gliwice, Poland</text>
    <rect x="236" y="244" width="162" height="32" rx="16" fill="#1c2446" stroke="#2f3a6b"/>
    <text x="317" y="265" text-anchor="middle" fill="#cdd5ff">🏗 Architecture first</text>
    <rect x="410" y="244" width="134" height="32" rx="16" fill="#0f3b36" stroke="#1f7a6d"/>
    <text x="477" y="265" text-anchor="middle" fill="#7af0dc">● Open to work</text>
  </g>

  <!-- mini whiteboard -->
  <g transform="translate(820,52)">
    <rect width="388" height="216" rx="14" fill="#0f1530" stroke="#2c3768"/>
    <circle cx="20" cy="18" r="5" fill="#ff6b6b" opacity=".8"/>
    <circle cx="38" cy="18" r="5" fill="#ffd166" opacity=".8"/>
    <circle cx="56" cy="18" r="5" fill="#5eead4" opacity=".8"/>
    <text x="370" y="23" text-anchor="end" class="sans" font-size="12" fill="#6d79b0">board · live</text>

    <rect class="hl" x="72" y="48" width="56" height="36" rx="7" fill="#8aa2ff"/>
    <text x="34" y="74" class="mono" font-size="24" fill="#e8ecff">2x + 3 = 11</text>
    <g class="l2"><text x="34" y="126" class="mono" font-size="24" fill="#e8ecff">2x = 8</text>
      <path d="M 128 84 C 150 100, 200 96, 140 116" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="212" y="104" class="sans" font-size="13" fill="#5eead4">−3 on both sides</text></g>
    <g class="l3"><text x="34" y="178" class="mono" font-size="24" fill="#5eead4">x = 4  ✓</text>
      <text x="200" y="178" class="sans" font-size="13" fill="#6d79b0">verified by CAS</text></g>

    <g class="cur" transform="translate(0,0)">
      <path d="M 320 140 l 0 22 l 6 -6 l 5 10 l 4 -2 l -5 -10 l 8 0 z" fill="#f4f6ff" stroke="#0f1530" stroke-width="1.5"/>
      <rect x="334" y="158" width="30" height="18" rx="9" fill="#8aa2ff"/>
      <text x="349" y="171" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#0b1020">AI</text>
    </g>
  </g>
</svg>
