<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a24"/>
      <stop offset="1" stop-color="#132b33"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1d3a44" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .blink { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>
  <rect x="1" y="1" width="598" height="318" rx="16" fill="url(#bg)" stroke="#24505c" stroke-width="2"/>
  <rect x="1" y="1" width="598" height="318" rx="16" fill="url(#grid)" opacity=".5"/>

  <text x="32" y="48" class="sans" font-size="12" font-weight="700" letter-spacing="2" fill="#5eead4">MY PRODUCT</text>
  <text x="32" y="88" class="sans" font-size="36" font-weight="700" fill="#f2fbfa">AI Data Studio</text>
  <text x="32" y="118" class="sans" font-size="16" fill="#9fc4c4">Spreadsheets &amp; databases in plain language</text>
  <text x="32" y="140" class="sans" font-size="16" fill="#9fc4c4">— review the diff before anything changes</text>

  <!-- prompt + diff table -->
  <g transform="translate(372,26)">
    <rect width="198" height="30" rx="8" fill="#0a161d" stroke="#2a5a66"/>
    <text x="12" y="20" class="mono" font-size="11" fill="#cfeeee">remove duplicates<tspan class="blink" fill="#5eead4">▍</tspan></text>
    <g class="mono" font-size="11">
      <rect y="40" width="198" height="24" fill="#10232b"/>
      <text x="10" y="56" fill="#7fa9ad">email</text><text x="120" y="56" fill="#7fa9ad">total</text>
      <rect y="64" width="198" height="24" fill="#0c1b22"/>
      <text x="10" y="80" fill="#cfeeee">ann@…</text><text x="120" y="80" fill="#cfeeee">1 200,50</text>
      <rect y="88" width="198" height="24" fill="#3a1418"/>
      <text x="10" y="104" fill="#ff8a8a" text-decoration="line-through">ann@…</text><text x="120" y="104" fill="#ff8a8a" text-decoration="line-through">1 200,50</text>
      <text x="186" y="104" text-anchor="end" fill="#ff8a8a">−</text>
      <rect y="112" width="198" height="24" fill="#0c1b22"/>
      <text x="10" y="128" fill="#cfeeee">bob@…</text><text x="120" y="128" fill="#cfeeee">340,00</text>
    </g>
  </g>

  <g class="mono" font-size="13" fill="#cfeeee">
    <rect x="32" y="164" width="300" height="34" rx="8" fill="#0a161d" stroke="#2a5a66"/>
    <text x="46" y="186"><tspan fill="#5eead4">sandbox</tspan> → <tspan fill="#ffd166">diff</tspan> → you decide</text>
  </g>

  <g class="sans" font-size="13" font-weight="600">
    <rect x="32" y="222" width="136" height="30" rx="15" fill="#12303a" stroke="#2f6170"/><text x="100" y="242" text-anchor="middle" fill="#cfeeee">Python sandbox</text>
    <rect x="176" y="222" width="112" height="30" rx="15" fill="#12303a" stroke="#2f6170"/><text x="232" y="242" text-anchor="middle" fill="#cfeeee">Diff preview</text>
    <rect x="296" y="222" width="122" height="30" rx="15" fill="#12303a" stroke="#2f6170"/><text x="357" y="242" text-anchor="middle" fill="#cfeeee">Privacy modes</text>
    <rect x="426" y="222" width="128" height="30" rx="15" fill="#12303a" stroke="#2f6170"/><text x="490" y="242" text-anchor="middle" fill="#cfeeee">Reconciliation</text>
    <rect x="32" y="262" width="156" height="30" rx="15" fill="#3b3212" stroke="#7a6a1f"/><text x="110" y="282" text-anchor="middle" fill="#ffd166">296 backend tests</text>
    <rect x="196" y="262" width="164" height="30" rx="15" fill="#3b3212" stroke="#7a6a1f"/><text x="278" y="282" text-anchor="middle" fill="#ffd166">2 security audits</text>
    <rect x="368" y="262" width="186" height="30" rx="15" fill="#3b3212" stroke="#7a6a1f"/><text x="461" y="282" text-anchor="middle" fill="#ffd166">Stripe SaaS · 14 languages</text>
  </g>
</svg>
